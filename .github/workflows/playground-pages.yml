name: Deploy Playground

on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "playground.css"
      - "playground.js"
      - "playground-worker.js"
      - "playground-gemini.js"
      - "playground-sandbox.js"
      - "playground-specification.js"
      - "playground-modules.test.js"
      - "poppop-formatter.js"
      - "playground-formatter.test.js"
      - "playground-localization.test.js"
      - "poppop-localization.js"
      - "poppop-logo.png"
      - "popcorn-logo.png"
      - "favicon.png"
      - "poppop-ogp.png"
      - "poppop_specification.md"
      - "poppop_lang/**"
      - "tools/build_playground_runtime.py"
      - ".github/workflows/playground-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playground-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the current Playground
        run: |
          mkdir _site
          cp index.html playground.css playground.js playground-worker.js playground-gemini.js playground-sandbox.js playground-specification.js poppop-formatter.js poppop-localization.js poppop-logo.png popcorn-logo.png favicon.png poppop-ogp.png _site/
          cp poppop_specification.md _site/
          touch _site/.nojekyll
          python tools/build_playground_runtime.py _site/poppop-runtime.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
