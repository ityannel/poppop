name: Deploy Playground

on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "lp/**"
      - "en/**"
      - "playground/**"
      - "itya-theme.css"
      - "popcorn-icons.js"
      - "playground.css"
      - "popcorn-visual.css"
      - "playground.js"
      - "playground-worker.js"
      - "popcorn-formatter.js"
      - "playground-formatter.test.js"
      - "playground-localization.test.js"
      - "popcorn-localization.js"
      - "popcorn-logo.png"
      - "popcorn-logo.png"
      - "favicon.png"
      - "popcorn-ogp.png"
      - "popcorn_specification.md"
      - "popcorn_lang/**"
      - "tools/build_playground_runtime.py"
      - ".github/workflows/playground-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playground-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the current Playground
        run: |
          mkdir _site
          cp index.html playground.css popcorn-visual.css itya-theme.css playground.js playground-worker.js popcorn-formatter.js popcorn-localization.js popcorn-icons.js popcorn-logo.png favicon.png popcorn-ogp.png _site/
          cp -r lp playground en _site/
          cp popcorn_specification.md _site/
          touch _site/.nojekyll
          python tools/build_playground_runtime.py _site/popcorn-runtime.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
